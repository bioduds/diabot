name: diabai
description: A simple diabetes education chat client for Ollama.
publish_to: none
# Bump the build number before producing a device-test APK. Local profile
# data is preserved across builds and can be cleared with the debug action.
version: 0.1.0+58

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  llama_cpp_dart: ^0.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  record: ^6.2.1
  sherpa_onnx: ^1.13.4
  path: ^1.9.1
  package_info_plus: ^8.0.0
  sqflite: ^2.3.3
  permission_handler: ^11.3.1
  langchain: ^0.8.1
  talker_flutter: ^5.1.16
  flutter_gemma: ^1.4.2
  flutter_gemma_litertlm: ^1.3.1
  audioplayers: ^6.8.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  intl: ^0.19.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/DiabAI.png
    - assets/images/diabai_icon_small.png
    - assets/i18n/pt-BR.json
    - assets/rag/knowledge_base.json
    - assets/rag/knowledge_embeddings.json
    - assets/models/embeddinggemma-300m-Q4_0.gguf
    - assets/stt/tiny-encoder.int8.onnx
    - assets/stt/tiny-decoder.int8.onnx
    - assets/stt/tiny-tokens.txt
